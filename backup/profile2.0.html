<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Profile</title>
    <link rel="stylesheet" href="assets\css\prof2.0.css">
</head>
<body>

<div class="container">

    <!-- TOP PROFILE SECTION -->
    <div class="profile-section">

        <div class="profile-left">
            <div class="avatar"></div>

            <div class="info-basic">
                <h2 class="member-name">JAIRUS NOELLE B. SEGOVIA</h2>
                <p class="member-email">segoviajanai123@gmail.com</p>
            </div>
        </div>

        <!-- RIGHT DAYS REMAINING CARD -->
        <div class="days-card">
            <div class="icon">🕒</div>
            <h1 class="days">100</h1>
            <p class="label">Days</p>
        </div>

    </div>


    <!-- BOTTOM INFO GRID -->
    <div class="other-info">

        <div class="info-item">
            <span class="label">Phone number:</span>
            <span class="value">09123456712</span>
        </div>

        <div class="info-item">
            <span class="label">Membership type:</span>
            <span class="value">Regular</span>
        </div>

        <div class="info-item">
            <span class="label">Status:</span>
            <span class="value active-status">Active</span>
        </div>

    </div>


    <!-- REVIEW CARD -->
    <div class="review-card">
        <div class="stars">★★★★★</div>

        <h3 class="review-title">Review title</h3>
        <p class="review-body">Review body</p>

        <p class="reviewer">Reviewer name</p>
    </div>

</div>

</body>
</html>
