<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - OxyGym</title>
    <link rel="stylesheet" href="assets/css/adminDashboard.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h1 class="logo">OxyGym Admin</h1>
            <nav>
                <ul>
                    <li class="active"><a href="#">Dashboard</a></li>
                    <li><a href="#">Manage Members</a></li>
                    <li><a href="#">Subscriptions</a></li>
                    <li><a href="#">Reports</a></li>
                </ul>
            </nav>
            <div class="logout">
                <a href="/Oxygym/logout.php">Logout</a>
            </div>
        </aside>
        <main class="main-content">
            <header>
                <h2>Dashboard Overview</h2>
            </header>
            <div class="card-container">
                </div>

            <section id="manage-members-section">
                <h2>Manage Members</h2>
                <div id="member-list-container"></div>
            </section>
        </main>
    </div>

    <div id="member-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
    const memberListContainer = document.getElementById('member-list-container');
    const modal = document.getElementById('member-modal');
    const modalBody = document.getElementById('modal-body');
    const closeButton = document.querySelector('.close-button');

    // Fetch and display members
    fetch('api/admin/members.php')
        .then(response => response.json())
        .then(members => {
            let html = '<table>';
            html += '<tr><th>Name</th><th>Email</th><th>Join Date</th><th>Expiry Date</th></tr>';
            members.forEach(member => {
                html += `<tr data-member-id="${member.Member_ID}">`;
                html += `<td>${member.First_Name} ${member.Last_Name}</td>`;
                html += `<td>${member.Email}</td>`;
                html += `<td>${member.Join_Date}</td>`;
                html += `<td>${member.Expiry_Date || 'N/A'}</td>`;
                html += '</tr>';
            });
            html += '</table>';
            memberListContainer.innerHTML = html;
        });

    // Handle clicking on a member row
    memberListContainer.addEventListener('click', function(e) {
        if (e.target.closest('tr')) {
            const memberId = e.target.closest('tr').dataset.memberId;
            if (memberId) {
                openMemberModal(memberId);
            }
        }
    });

    function openMemberModal(memberId) {
        // Fetch member details and transactions
        Promise.all([
            fetch(`api/get_member_details.php?member_id=${memberId}`).then(res => res.json()),
            fetch(`api/get_member_transactions.php?member_id=${memberId}`).then(res => res.json())
        ]).then(([memberDetails, transactions]) => {
            let content = `<h3>${memberDetails.First_Name} ${memberDetails.Last_Name}</h3>`;
            content += `<p><strong>Email:</strong> ${memberDetails.Email}</p>`;
            content += `<p><strong>Phone:</strong> ${memberDetails.Phone}</p>`;
            content += `<p><strong>Address:</strong> ${memberDetails.Address}</p>`;
            content += `<p><strong>Join Date:</strong> ${memberDetails.Join_Date}</p>`;
            
            content += '<h4>Transaction History</h4>';
            if (transactions.length > 0) {
                content += '<table>';
                content += '<tr><th>Date</th><th>Amount</th><th>Plan</th><th>Status</th></tr>';
                transactions.forEach(t => {
                    content += `<tr>`;
                    content += `<td>${t.Transaction_Date}</td>`;
                    content += `<td>₱${t.Amount}</td>`;
                    content += `<td>${t.Membership_Name}</td>`;
                    content += `<td>${t.Status}</td>`;
                    content += `</tr>`;
                });
                content += '</table>';
            } else {
                content += '<p>No transactions found.</p>';
            }

            modalBody.innerHTML = content;
            modal.style.display = 'block';
        });
    }

    // Close modal
    closeButton.onclick = () => modal.style.display = 'none';
    window.onclick = (event) => {
        if (event.target == modal) {
            modal.style.display = 'none';
        }
    };
});
    </script>
</body>
</html>
