<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login / Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .auth-card {
            background-color: white;
            padding: 2.5rem;
            border-radius: 2rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1),
                0 4px 6px -2px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
            backdrop-filter: blur(10px);
            background-image: linear-gradient(
                to bottom right,
                rgba(255, 255, 255, 0.9),
                rgba(255, 255, 255, 0.6)
            );
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
            text-align: left;
        }
        .input-group input {
            width: 100%;
            padding-left: 2.5rem;
            padding-right: 1rem;
            padding-top: 0.75rem;
            padding-bottom: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            font-size: 1rem;
            outline-offset: 2px;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        .input-group .icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            pointer-events: none;
        }
        button[type="submit"] {
            width: 100%;
            background-color: #3b82f6;
            color: white;
            font-weight: 600;
            padding: 0.75rem;
            border-radius: 0.75rem;
            font-size: 1.125rem;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button[type="submit"]:hover { background-color: #2563eb; }
        .error-message {
            color: #dc2626;
            margin-bottom: 1rem;
            font-weight: 500;
            min-height: 1.5rem;
            text-align: left;
        }
        .back-link { text-align: center; margin-top: 1rem; }
        .back-link a { color: #3b82f6; text-decoration: none; font-weight: 500; }
        .back-link a:hover { text-decoration: underline; }
        .small-link { font-size: 0.9rem; color: #374151; }
        .small-link a { color: #3b82f6; font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>
    <div class="auth-card">
        <!-- LOGIN VIEW (default) -->
        <div id="login" class="tab-content active">
            <h1 class="text-3xl font-bold mb-2">Welcome Back</h1>
            <p class="text-sm text-gray-500 mb-8">Login to your account</p>
            <form id="loginForm" novalidate>
                <div class="input-group">
                    <i class="fas fa-envelope icon"></i>
                    <input type="email" id="username" placeholder="Email" required />
                </div>
                <div class="input-group">
                    <i class="fas fa-lock icon"></i>
                    <input type="password" id="password" placeholder="Password" required />
                </div>
                <p class="small-link text-left" style="margin-bottom:10px;">
                    Don't have an account yet? <a href="#" id="showSignup">Sign up</a>
                </p>
                <div id="loginError" class="error-message"></div>
                <button type="submit">Login</button>
            </form>
        </div>

        <!-- SIGNUP VIEW (hidden by default) -->
        <div id="signup" class="tab-content">
            <h1 class="text-3xl font-bold mb-2">Create Account</h1>
            <p class="text-sm text-gray-500 mb-8">Join OxyGym today</p>
            <form id="signupForm" novalidate>
                <div class="input-group">
                    <i class="fas fa-user icon"></i>
                    <input type="text" id="signupFirstName" placeholder="First Name" required />
                </div>
                <div class="input-group">
                    <i class="fas fa-user icon"></i>
                    <input type="text" id="signupLastName" placeholder="Last Name" required />
                </div>
                <div class="input-group">
                    <i class="fas fa-envelope icon"></i>
                    <input type="email" id="signupEmail" placeholder="Email" required />
                </div>
                <div class="input-group">
                    <i class="fas fa-lock icon"></i>
                    <input type="password" id="signupPassword" placeholder="Password" required />
                </div>
                <div id="signupError" class="error-message"></div>
                <button type="submit">Sign Up</button>
            </form>
        </div>

        <div class="back-link">
            <a href="index.html">← Back to Home</a>
        </div>
    </div>

    <script src="assets/js/auth.js"></script>
</body>
</html>
