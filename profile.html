<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>User Profile - Jairus Noelle B. Segovia</title>
    <link rel="stylesheet" href="assets\css\globalguide.css" />
    <link rel="stylesheet" href="assets\css\styleguide.css" />
    <link rel="stylesheet" href="assets\css\profile card.css" />
  </head>
  <body>
    <main class="frame">
      <section class="profile-header">
        <img class="profile-avatar" src="img/ellipse-19.svg" alt="Profile picture of Jairus Noelle B. Segovia" />
        <div class="profile-avatar-placeholder" aria-hidden="true"></div>
        <header class="text-content-flow">
          <div class="text-content-heading">
            <h1 class="heading">JAIRUS NOELLE B. SEGOVIA</h1>
            <p class="subheading">segoviajairus339@gmail.com</p>
          </div>
        </header>
      </section>
      <section class="user-details" aria-labelledby="user-details-heading">
        <h2 id="user-details-heading" class="visually-hidden">User Details</h2>
        <dl class="details-list">
          <div class="detail-item">
            <dt class="phone-number">Phone number:</dt>
            <dd class="element-regular">09123456712</dd>
          </div>
          <div class="detail-item">
            <dt class="phone-number">Membership type:</dt>
            <dd class="element-regular">Regular</dd>
          </div>
          <div class="detail-item">
            <dt class="phone-number">Status:</dt>
            <dd class="element-regular">Active</dd>
          </div>
        </dl>
      </section>
      <aside class="stats-card" aria-labelledby="stats-heading">
        <h2 id="stats-heading" class="visually-hidden">Membership Duration</h2>
        <img class="clock" src="img/clock.svg" alt="Clock icon" />
        <div class="review-body">
          <div class="div-wrapper">
            <p class="text-heading">100</p>
          </div>
          <div class="div-wrapper">
            <p class="text">Days</p>
          </div>
        </div>
      </aside>
      <article class="review-card" aria-labelledby="review-title">
        <div class="rating" role="img" aria-label="Rating: 4 out of 5 stars">
          <img class="star" src="img/star.svg" alt="" />
          <img class="star" src="img/star.svg" alt="" />
          <img class="star" src="img/star.svg" alt="" />
          <img class="star" src="img/star.svg" alt="" />
          <img class="star" src="img/image.svg" alt="" />
        </div>
        <div class="div">
          <div class="text-heading-wrapper">
            <h3 id="review-title" class="text-wrapper">Review title</h3>
          </div>
          <div class="text-2">
            <p class="text-3">Review body</p>
          </div>
        </div>
        <footer class="avatar-block">
          <div class="avatar" role="img" aria-label="Reviewer avatar"></div>
          <div class="info">
            <p class="title">Reviewer name</p>
            <time class="description" datetime="">Date</time>
          </div>
        </footer>
      </article>
    </main>
  </body>
</html>
