<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Jairus Noelle B. Segovia</title>
    <link rel="stylesheet" href="assets/css/profile.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="container nav-container">
            <h1 class="logo">LOGO OF OXYGYM</h1>
            <nav>
                <ul>
                    <li><a href="index.html#about-section">About</a></li>
                    <li><a href="index.html#plan-section">Plan</a></li>
                </ul>
            </nav>
            <a href="login.html" class="register-btn">Sign Up</a>
        </div>
    </header>


    <main class="frame">

        <!-- Profile Header -->
        <section class="profile-header">
            <img class="profile-avatar" src="assets/images/ellipse-19.svg" alt="Profile picture of Jairus Noelle B. Segovia">
            <div class="text-content-flow">
                <h1 class="heading">JAIRUS NOELLE B. SEGOVIA</h1>
                <p class="subheading">segoviajairus339@gmail.com</p>
            </div>
        </section>

        <!-- User Details -->
        <section class="user-details" aria-labelledby="user-details-heading">
            <h2 id="user-details-heading" class="visually-hidden">User Details</h2>
            <dl class="details-list">
                <div class="detail-item">
                    <dt>Phone number:</dt>
                    <dd>09123456712</dd>
                </div>
                <div class="detail-item">
                    <dt>Membership type:</dt>
                    <dd>Regular</dd>
                </div>
                <div class="detail-item">
                    <dt>Status:</dt>
                    <dd>Active</dd>
                </div>
            </dl>
        </section>

        <!-- Stats Card -->
        <aside class="stats-card" aria-labelledby="stats-heading">
            <h2 id="stats-heading" class="visually-hidden">Membership Duration</h2>
            <img class="clock" src="assets/images/clock.svg" alt="Clock icon">
            <div class="review-body">
                <div class="div-wrapper">
                    <p class="text-heading">100</p>
                </div>
                <div class="div-wrapper">
                    <p class="text">Days</p>
                </div>
            </div>
        </aside>

        <!-- Review Card -->
        <article class="review-card" aria-labelledby="review-title">
            <div class="rating" role="img" aria-label="Rating: 4 out of 5 stars">
                <img class="star" src="assets/images/star.svg" alt="">
                <img class="star" src="assets/images/star.svg" alt="">
                <img class="star" src="assets/images/star.svg" alt="">
                <img class="star" src="assets/images/star.svg" alt="">
                <img class="star" src="assets/images/star-empty.svg" alt="">
            </div>
            <div class="div">
                <div class="text-heading-wrapper">
                    <h3 id="review-title" class="text-wrapper">Review title</h3>
                </div>
                <div class="text-2">
                    <p class="text-3">Review body</p>
                </div>
            </div>
            <footer class="avatar-block">
                <div class="avatar" role="img" aria-label="Reviewer avatar" style="background-image: url('assets/images/shape.png')"></div>
                <div class="info">
                    <p class="title">Reviewer name</p>
                    <time class="description" datetime="">Date</time>
                </div>
            </footer>
        </article>

    </main>

</body>
</html>
